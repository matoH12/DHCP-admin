services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhcp-admin-backend
    restart: unless-stopped
    ports:
      # Backend API is NOT exposed externally - only accessible via Docker network
      # Frontend communicates with backend internally
      - "0.0.0.0:514:514/udp"  # Syslog UDP port on all interfaces (for host-network DHCP)
    environment:
      # Application
      - APP_NAME=DHCP Admin
      - DEBUG=false

      # Database
      - DATABASE_URL=sqlite:///./data/dhcp-admin.db

      # Security (CHANGE THESE IN PRODUCTION!)
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key-min-32-chars}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3003,http://localhost:80}

      # DHCP Configuration
      - DHCP_CONFIG_PATH=/dhcp-config/dhcpd.conf
      # Docker network is auto-detected, but you can override it:
      # - DOCKER_NETWORK_SUBNET=${DOCKER_NETWORK_SUBNET}

      # Admin User (CHANGE THESE IN PRODUCTION!)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminDHCP2026!}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}

    volumes:
      # Database persistence
      - ./data:/app/data

      # DHCP config output (mount to your DHCP server config directory)
      - ./dhcp-config:/dhcp-config

      # DHCP logs (shared with dhcp-server)
      - ./dhcp-logs:/var/log/dhcp

      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock

      # For production, you might want to mount directly to /etc/dhcp:
      # - /etc/dhcp:/dhcp-config

    networks:
      - dhcp-admin-network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhcp-admin-frontend
    restart: unless-stopped
    ports:
      - "3003:80"  # Frontend HTTP port
    networks:
      - dhcp-admin-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dhcp-server:
    build:
      context: ./dhcp-server
      dockerfile: Dockerfile
    container_name: dhcp-admin-dhcp-server
    restart: unless-stopped
    # Use host network for DHCP to work on physical network interfaces
    network_mode: host
    # Network capabilities required for DHCP operation
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Backend syslog server (will be auto-detected from Docker network)
      - BACKEND_SYSLOG_HOST=backend
      - BACKEND_SYSLOG_PORT=514
    volumes:
      # Shared DHCP configuration with backend
      - ./dhcp-config:/dhcp-config

      # DHCP leases persistence
      - ./dhcp-leases:/var/lib/dhcp

      # DHCP logs (shared with backend)
      - ./dhcp-logs:/var/log/dhcp
    depends_on:
      - backend

networks:
  dhcp-admin-network:
    driver: bridge
    # Docker will auto-assign a free subnet from its default pool
    # The backend will auto-detect the subnet and add it to the database

volumes:
  dhcp-data:
    driver: local
