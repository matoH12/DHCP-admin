# DHCP server logging configuration
# Logs are written to shared volume accessible by backend

# Forward all dhcpd logs to backend syslog server (via host port 514)
# Using localhost because dhcp-server uses host network mode
:programname, isequal, "dhcpd" @127.0.0.1:514

# DHCP daemon logs (all severities)
# DHCP uses log-facility local7 (configured in dhcpd.conf)
local7.* /var/log/dhcp/dhcpd.log

# All DHCP server messages
*.info /var/log/dhcp/messages.log
